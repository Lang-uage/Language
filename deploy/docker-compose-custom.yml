services:
  langflow:
    image: "langflow-custom"
    build:
      context: ../
      dockerfile: Dockerfile
    environment:
      # Database Configuration
      - LANGFLOW_DATABASE_URL=${LANGFLOW_DATABASE_URL}
      # Cache Configuration
      - LANGFLOW_CACHE_TYPE=${LANGFLOW_CACHE_TYPE}
      # Worker Configuration
      - LANGFLOW_WORKERS=${LANGFLOW_WORKERS}
      - LANGFLOW_WORKER_TIMEOUT=${LANGFLOW_WORKER_TIMEOUT}
      # Authentication Configuration
      - LANGFLOW_AUTO_LOGIN=${LANGFLOW_AUTO_LOGIN}
      - LANGFLOW_SUPERUSER=${LANGFLOW_SUPERUSER}
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_SUPERUSER_PASSWORD}
      # Security Configuration
      - LANGFLOW_SECRET_KEY=${LANGFLOW_SECRET_KEY}
      # Application Configuration
      - LANGFLOW_CONFIG_DIR=${LANGFLOW_CONFIG_DIR}
      # Logging Configuration
      - LANGFLOW_LOG_ENV=${LANGFLOW_LOG_ENV}
    ports:
      - "${LANGFLOW_PORT}:7860"
    volumes:
      - langflow-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  langflow-data: 